<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="BoxBuddy: plan your home move. Inventory and volume, truck size, load plan, QR box labels you scan to see what's inside, moving-day check-in, checklist and quote comparison.">
  <meta name="theme-color" content="#0f766e">
  <title>BoxBuddy</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script src="vendor/qrcode.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/home"><img src="icons/icon.svg" alt="" class="brand-mark">BoxBuddy</a>
      <nav class="tabs" aria-label="Main">
        <a href="#/home" data-view="home">Home</a>
        <a href="#/inventory" data-view="inventory">Inventory</a>
        <a href="#/boxes" data-view="boxes">Boxes</a>
        <a href="#/scan" data-view="scan">Scan</a>
        <a href="#/moveday" data-view="moveday">Moving day</a>
        <a href="#/plan" data-view="plan">Truck</a>
        <a href="#/checklist" data-view="checklist">Checklist</a>
        <a href="#/quotes" data-view="quotes">Quotes</a>
        <a href="#/settings" data-view="settings">Settings</a>
      </nav>
    </div>
  </header>
  <main id="view" tabindex="-1"><p class="empty">Loading…</p></main>
  <footer>BoxBuddy keeps everything on this device. Volumes, weights and truck sizes are estimates.</footer>
  <div id="print-area" aria-hidden="true"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <noscript><p class="empty">BoxBuddy needs JavaScript.</p></noscript>
</body>
</html>
